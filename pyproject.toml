[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-delay-cancellation-prediction"
version = "0.1.0"
description = "BTS and NOAA airline disruption prediction pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Krishna Sanjay"}]
dependencies = [
  "duckdb>=1.1,<2",
  "httpx>=0.27,<1",
  "joblib>=1.4,<2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "pyarrow>=17,<21",
  "pydantic-settings>=2.5,<3",
  "scikit-learn>=1.5,<2",
  "streamlit>=1.39,<2",
  "tenacity>=9,<10",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "ruff>=0.7,<1"]

[project.scripts]
airline-risk = "airline_risk.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=airline_risk --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py311"

